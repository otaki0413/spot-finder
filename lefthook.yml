glob_matcher: doublestar

pre-commit:
  exclude:
    - .agents/skills/**
  jobs:
    - name: format
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    - name: lint
      run: pnpm exec oxlint --deny-warnings {staged_files}
      glob: "**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}"

pre-push:
  jobs:
    - name: typecheck
      run: pnpm typecheck
    - name: test
      run: pnpm test && pnpm test:e2e
