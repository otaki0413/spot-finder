glob_matcher: doublestar

pre-commit:
  jobs:
    - name: format
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      exclude:
        - .agents/skills/**
      stage_fixed: true
    - name: lint
      run: pnpm exec oxlint --deny-warnings {staged_files}
      glob: "**/*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}"
      exclude:
        - .agents/skills/**

pre-push:
  jobs:
    - name: typecheck
      run: pnpm typecheck
    - name: test
      run: pnpm test && pnpm test:e2e
