name: React Doctor

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: react-doctor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doctor:
    name: React Doctor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      REACT_DOCTOR_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          cache: pnpm
      # 診断で参照する既存Oxlint設定のJSプラグインも解決できるようにする。
      - run: pnpm install --frozen-lockfile
      - uses: millionco/react-doctor@013f7373f91a3b9e68bd1dc7d4d354f4b041b117 # v2
        with:
          directory: apps/web
          version: "0.9.13"
          node-version: "24.20.0"
          scope: ${{ github.event_name == 'pull_request' && 'changed' || 'full' }}
          blocking: none
          comment: "true"
          review-comments: "false"
          commit-status: "false"
      # 公式Actionはpush時の終了コードを無視するため、診断の実行失敗を別途検出する。
      - name: Verify scan completed
        run: |
          jq --exit-status '
            .ok == true and .error == null and
            all(.projects[]; .complete == true)
          ' "$RUNNER_TEMP/react-doctor-report-$GITHUB_RUN_ID.json"
