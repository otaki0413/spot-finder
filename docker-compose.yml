services:
  db:
    image: postgis/postgis:18-3.6@sha256:60f6ad1d21ea86a67d47780b9a0d1e1d200500f62b19293fa834d0dea80b8677
    # PostGIS提供イメージはamd64のみ。Apple Siliconではエミュレーションを使う。
    platform: linux/amd64
    environment:
      POSTGRES_DB: spot_finder
      POSTGRES_USER: spot_finder
      POSTGRES_PASSWORD: spot_finder
    volumes:
      - postgres_data:/var/lib/postgresql
      # イメージ同梱の10_postgis.shがDBでPostGIS拡張を有効化する。
      # 初期化ファイルは名前順に実行されるため、PostGISの型を使うSQLには20を付ける。
      # ディレクトリ全体をマウントすると10_postgis.shが隠れるため、SQLだけをマウントする。
      - ./db/init/20-init-spots.sql:/docker-entrypoint-initdb.d/20-init-spots.sql:ro
      - ./db/seed/landit_coding_test_seed.csv:/seed/landit_coding_test_seed.csv:ro
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-h",
          "127.0.0.1",
          "-U",
          "spot_finder",
          "-d",
          "spot_finder",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: .
    init: true
    command: ["pnpm", "--filter", "@spot-finder/api", "start:dev"]
    environment:
      PORT: "3001"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: spot_finder
      DB_USER: spot_finder
      DB_PASSWORD: spot_finder
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./apps/api/src:/app/apps/api/src:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    init: true
    command: ["pnpm", "--filter", "@spot-finder/web", "dev"]
    environment:
      API_URL: http://api:3001
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./apps/web/src:/app/apps/web/src:ro
    depends_on:
      - api

volumes:
  postgres_data:
